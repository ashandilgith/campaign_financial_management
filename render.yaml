# Render Blueprint: New → Blueprint → pick this repo.
# You'll be asked for the values marked sync: false (OPENAI_API_KEY, admin login).
services:
  - type: web
    name: campaign-finance
    runtime: python
    plan: starter            # disks need a paid plan; uploaded receipts live on the disk
    region: singapore        # closest Render region to Sri Lanka
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campaign-finance-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-6-luna
      - key: AI_REASONING_EFFORT
        value: low
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SEED_DEMO          # "1" loads demo campaigns into an empty database; set "0" for live use
        value: "1"
      - key: EMAIL_PROVIDER     # simulated | outlook | smtp
        value: simulated
      - key: REPORT_AGENCY_NAME
        value: "Your Agency (Pvt) Ltd"
      - key: MS_GRAPH_TENANT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_ID
        sync: false
      - key: MS_GRAPH_CLIENT_SECRET
        sync: false
      - key: MS_GRAPH_SENDER
        sync: false

databases:
  - name: campaign-finance-db
    plan: basic-256mb
    region: singapore
    databaseName: campaign_finance
    user: campaign_finance
