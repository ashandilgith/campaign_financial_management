{% extends "finance/base.html" %}{% block title %}Reset password{% endblock %}{% block content %}
<div class="card" style="max-width:420px;margin:3rem auto"><h1>Reset your password</h1>
<form method="post">{% csrf_token %}<p><label>Your email address</label>{{ form.email }}{% for e in form.email.errors %}<span class="neg small">{{ e }}</span>{% endfor %}</p><button class="btn" style="width:100%">Email me a link</button></form>
<p class="small"><a href="{% url 'login' %}">Back to sign in</a></p></div>{% endblock %}
