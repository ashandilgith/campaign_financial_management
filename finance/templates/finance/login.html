{% extends "finance/base.html" %}
{% block title %}Sign in · Campaign Finance{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:3rem auto">
  <h1>Campaign Finance</h1>
  <p class="muted small">Sign in to submit, approve or process campaign payments.</p>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    <p><label for="id_username">Username</label>{{ form.username }}</p>
    <p><label for="id_password">Password</label>{{ form.password }}</p>
    <button class="btn" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
