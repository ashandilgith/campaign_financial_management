name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (AI calls are mocked – no key needed)
        run: python manage.py test finance -v 2
      - name: Deploy checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-for-checks-only
          RENDER_EXTERNAL_HOSTNAME: example.onrender.com
        run: |
          python manage.py collectstatic --noinput
          python manage.py check --deploy --fail-level ERROR
